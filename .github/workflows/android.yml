name: Launcher Stability CI

on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/**'
      - 'launcher-**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: launcher-stability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Test and build APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk             out/LauncherStability-17.3.12-stability-hotfix8.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LauncherStability-17.3.12-stability-hotfix8
          path: out/LauncherStability-17.3.12-stability-hotfix8.apk
          if-no-files-found: error
          retention-days: 14
